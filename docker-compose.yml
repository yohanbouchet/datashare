services:
  db:
    image: postgres:18-alpine          # PostgreSQL 18, version "alpine" = image légère
    container_name: datashare-db
    restart: unless-stopped            # redémarre seul après un reboot de la machine
    env_file: .env                     # lit POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"   # accessible seulement depuis la machine elle-même
    volumes:
      - db-data:/var/lib/postgresql    # les données survivent à la suppression du conteneur
    healthcheck:                       # Docker vérifie que la base répond vraiment
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
